name: geo-monitor-collector
services:
  collector:
    build:
      context: ..
      dockerfile: deploy/collector.Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "${GEO_COLLECTOR_CPUS:-0.25}"
    mem_limit: "${GEO_COLLECTOR_MEMORY_LIMIT:-128m}"
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16777216,mode=1777,noexec,nosuid
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    user: "${GEO_COLLECTOR_UID:-0}:${GEO_COLLECTOR_GID:-0}"
    volumes:
      - type: bind
        source: ${GEO_LOG_DIRECTORY:?Set GEO_LOG_DIRECTORY}
        target: /logs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GEO_COLLECTOR_CONFIG:?Set GEO_COLLECTOR_CONFIG}
        target: /config/collector.json
        read_only: true
        bind:
          create_host_path: false
      - collector-state:/state
    security_opt:
      - no-new-privileges:true
volumes:
  collector-state:
