name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.31'
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: uv run ruff check internal cmd tests scripts
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: uv run pytest -q
      - run: uv build --wheel --out-dir .local/build/python
      - run: bash -n scripts/deploy.sh && bash -n scripts/install-collector.sh && bash -n scripts/collector-control.sh
      - run: uv run python scripts/container_smoke.py --full
      - run: uv run python scripts/container_smoke.py --full --protocol http --report .local/output/container-http-acceptance.json
      - run: uv run python tests/deployment/deploy_script.py
      - name: Preserve acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-acceptance-${{ github.sha }}
          path: .local/output/*acceptance*.json
          if-no-files-found: warn
          retention-days: 30
